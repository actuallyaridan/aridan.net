    <main class="container" id="mainContent" tabindex="-1">
        <div class="info">
            <p class="icon"><i class="fa-solid fa-pen-nib icon-background" aria-hidden="true"></i></p>
            <div>
                <h1 class="name">New article</h1>
                <p class="description titleColor">Create a new article and save it straight into <code>assets/content/articles/</code>. </p>
                <div class="articleAdminBar">
                    <a href="/articles/" class="button backButton" title="Back to Articles" aria-label="Back to Articles"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
                    <button type="submit" form="editorForm" class="button primary" id="saveArticle"
                        title="Save (Ctrl+S)">
                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>Save
                    </button>
                    <button type="button" class="button" id="downloadArticle">
                        <i class="fa-solid fa-download" aria-hidden="true"></i>Download
                    </button>
                </div>
            </div>

            <span class="warn" id="editorFolderBar">
                <p role="status" aria-live="polite"><span id="editorFolderState">No folder selected yet.</span></p>
                <button type="button" class="button" id="editorPickFolder"
                    title="Pick assets/content/articles/">Select folder</button>
            </span>
        </div>
        <hr>

        <div class="editorLayout">
            <form class="section editorForm" id="editorForm" autocomplete="off" novalidate>
                <label class="editorField">
                    <span>Title</span>
                    <input type="text" id="fieldTitle" class="button" placeholder="Just a title, nothing fancy" required>
                </label>

                <label class="editorField">
                    <span>File name</span>
                    <input type="text" id="fieldSlug" class="button" placeholder="the-identifier-for-this-article" required>
                    <small id="slugHint">Becomes <code>&lt;name&gt;.md</code> and the article's web address.</small>
                </label>

                <label class="editorField">
                    <span>Date</span>
                    <input type="date" id="fieldDate" class="button" required>
                </label>

                <label class="editorField">
                    <span>Preview</span>
                    <textarea id="fieldPreview" class="button" rows="3"
                        placeholder="A short description of the article for the listing page."></textarea>
                </label>

                <div class="editorField">
                    <span>Body</span>
                    <div id="fieldBodyEditor"></div>
                    <textarea id="fieldBody" class="button editorBody hide" rows="18"
                        placeholder="## A heading&#10;&#10;Write your article in Markdown."></textarea>
                </div>
            </form>

        </div>
    </main>

    <div id="loading" style="display: none;">
        <div>
